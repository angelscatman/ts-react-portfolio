services:
  portfolio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ts-portfolio
    restart: unless-stopped

    read_only: true # Only allow writing to tmpfs mounts (see below).

    # Nginx needs to write to some directories, such as /tmp, /var/cache/nginx, and /var/run.
    tmpfs:
      - /tmp:exec,mode=1777
      - /var/cache/nginx
      - /var/run

    expose:
      - '8080'
    ports:
      - '${HOST_PORT:-8080}:8080'
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - public_network

networks:
  public_network:
    external: true
    name: ${PUBLIC_NETWORK_NAME:-public_network}